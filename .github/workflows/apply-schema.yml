name: Apply Supabase schema

# Runs supabase/schema.sql against the database automatically whenever it
# changes on main, so schema changes never need a manual copy-paste into the
# Supabase SQL editor. Safe to re-run — the file is written to be idempotent
# (IF NOT EXISTS / ON CONFLICT DO NOTHING throughout).

on:
  push:
    branches: [main]
    paths:
      - 'supabase/schema.sql'
  workflow_dispatch: {}

jobs:
  apply-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply schema.sql
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/schema.sql
